name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Publicar APK em uma Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LeveLauncher.apk
          cp profissional/build/outputs/apk/release/profissional-release.apk LauncherLeveProfissional.apk
          gh release create "v${{ github.run_number }}" LeveLauncher.apk LauncherLeveProfissional.apk \
            --title "Leve Launcher v${{ github.run_number }}" \
            --notes "LeveLauncher.apk = launcher minimalista espacial. LauncherLeveProfissional.apk = launcher com letras grandes e fácil de usar. Os dois instalam por cima da versão anterior."
