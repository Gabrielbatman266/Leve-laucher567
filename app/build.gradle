plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leve.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.leve.launcher'
        minSdk 21
        targetSdk 34
        // Número da compilação do GitHub = número da Release (v16, v17...)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName 'v' + (System.getenv('GITHUB_RUN_NUMBER') ?: 'dev')
    }

    // Chave fixa: assim as próximas versões instalam por cima, sem desinstalar.
    signingConfigs {
        leve {
            storeFile file('leve.keystore')
            storePassword 'leve123456'
            keyAlias 'leve'
            keyPassword 'leve123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.leve
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Testes de estresse (rodam no PC/servidor, não entram no APK): gradle :app:testDebugUnitTest
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '3g'
                testLogging { events 'failed'; showStandardStreams = true }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
// Sem nenhuma biblioteca extra: o app fica com poucos KB e usa pouca RAM.
